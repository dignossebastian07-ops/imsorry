<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I’m sorry</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg1:#dcd6ec;--bg2:#f3d9d3;--paper:#fbfaf7;--ink:#2b2f4a;--soft:#5d6180;--env:#c9c2de;--env2:#b7aed0;--seal:#9b2d45;--glow:#f2b38c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#161a33;--bg2:#2d1f3a;--paper:#eef0f4;--ink:#2b2f4a;--soft:#a9adc8;--env:#3b4170;--env2:#2f3560;}}
:root[data-theme="dark"]{--bg1:#161a33;--bg2:#2d1f3a;--paper:#eef0f4;--ink:#2b2f4a;--soft:#a9adc8;--env:#3b4170;--env2:#2f3560}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Newsreader',Georgia,serif;color:var(--soft);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-size:160% 160%;animation:drift 18s ease-in-out infinite alternate;overflow-x:hidden}
@keyframes drift{to{background-position:100% 100%}}
.screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:2rem 1.25rem;text-align:center;transition:opacity .7s,transform .7s}
.hidden{display:none!important}
h1{font-weight:500;font-size:clamp(1.9rem,7vw,2.8rem);margin:0;color:var(--ink);line-height:1.15}
:root:not([data-theme="light"]) h1{color:inherit}
@media (prefers-color-scheme:light){h1{color:var(--ink)}}
p.sub{margin:0;max-width:30ch;font-style:italic;line-height:1.5}
input{font:inherit;font-size:1.1rem;width:min(80vw,300px);padding:.75rem 1rem;border-radius:12px;border:1.5px solid var(--env2);background:var(--paper);color:var(--ink);text-align:center}
input:focus-visible,button:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
.btn{font:inherit;font-size:1.05rem;padding:.8rem 1.6rem;border:0;border-radius:999px;background:var(--seal);color:#fff;cursor:pointer;transition:transform .2s}
.btn:active{transform:scale(.96)}
/* envelope */
.envelope{position:relative;width:min(84vw,340px);height:min(56vw,226px);-webkit-perspective:900px;background:var(--env2);border-radius:6px;perspective:900px;filter:drop-shadow(0 18px 30px rgba(20,15,50,.35));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.open .envelope,.open.envelope{animation:none}
.note{position:absolute;left:7%;right:7%;top:6%;bottom:6%;background:var(--paper);border-radius:3px;transition:transform 1s .9s cubic-bezier(.3,.8,.3,1);z-index:1;display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-size:1.7rem;color:#2b2f4a}
.front{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--env);-webkit-clip-path:polygon(0 100%,0 0,50% 55%,100% 0,100% 100%);clip-path:polygon(0 100%,0 0,50% 55%,100% 0,100% 100%);z-index:2;border-radius:6px}
.flap{position:absolute;left:0;right:0;top:0;height:55%;background:var(--env2);-webkit-clip-path:polygon(0 0,100% 0,50% 100%);clip-path:polygon(0 0,100% 0,50% 100%);-webkit-transform-origin:top;transform-origin:top;-webkit-backface-visibility:hidden;backface-visibility:hidden;-webkit-transition:-webkit-transform .9s cubic-bezier(.5,0,.2,1),z-index 0s .45s;transition:transform .9s cubic-bezier(.5,0,.2,1),z-index 0s .45s;z-index:3;filter:brightness(1.08)}
.note,.flap,.front{-webkit-transform:translateZ(0)}
.to{position:absolute;bottom:12%;left:0;right:0;text-align:center;font-family:'Caveat',cursive;font-size:1.6rem;color:#2b2f4a;z-index:2}
.seal{position:absolute;left:50%;top:55%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#c4465f,var(--seal) 60%,#6e1f33);color:#fbe3dc;font-size:1.6rem;z-index:5;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.35);animation:beat 1.8s ease-in-out infinite;transition:opacity .4s,transform .4s}
@keyframes beat{50%{transform:scale(1.1)}}
.go .seal{opacity:0;transform:scale(.4);animation:none;pointer-events:none}
.go .flap{-webkit-transform:rotateX(180deg);transform:rotateX(180deg);z-index:0}
.go .note{transform:translateY(-62%);z-index:1}
.leave{opacity:0;transform:translateY(40px)}
.hint{font-style:italic;font-size:1rem}
/* letter */
#letter{min-height:100%;display:flex;justify-content:center;padding:1.5rem 1rem 3rem}
.paper{width:min(100%,520px);background:var(--paper);color:var(--ink);padding:2.2rem 1.6rem 2.4rem;border-radius:4px;box-shadow:0 24px 50px rgba(20,15,50,.35);font-family:'Caveat',cursive;font-size:clamp(1.45rem,5.4vw,1.8rem);line-height:1.55;background-image:repeating-linear-gradient(transparent 0 calc(1.55em - 1px),rgba(120,130,190,.18) calc(1.55em - 1px) 1.55em);animation:arrive 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(60px) rotate(-1.5deg)}}
.ln{margin:0 0 1.55em;-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0);-webkit-animation:write 1.6s steps(28,end) forwards;animation:write 1.6s steps(28,end) forwards;-webkit-animation-delay:var(--d);animation-delay:var(--d)}
@-webkit-keyframes write{to{-webkit-clip-path:inset(0 0 0 0)}}
@keyframes write{to{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0)}}
.sign{margin-top:2rem;font-weight:600}
.again{display:block;margin:1.4rem auto 0;opacity:0;animation:fade 1s forwards;animation-delay:var(--d)}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>

<main id="intro" class="screen">
  <h1>I have something to say</h1>
  <p class="sub">Tell me who it’s for, and who it’s from.</p>
  <input id="to" placeholder="For" autocomplete="off" aria-label="Recipient name">
  <input id="from" placeholder="From" autocomplete="off" aria-label="Your name">
  <button class="btn" id="seal">Seal the letter</button>
</main>

<main id="envScreen" class="screen hidden">
  <div class="envelope" id="env">
    <div class="note">I’m sorry</div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="to" id="toLine"></div>
    <button class="seal" id="open" aria-label="Break the seal and open the letter">♥</button>
  </div>
  <p class="hint">Tap the seal</p>
</main>

<section id="letter" class="hidden" aria-live="polite">
  <div class="paper" id="paper"></div>
</section>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var to='', from='';
  var lines=[
    function(){return 'Dear '+to+','},
    'I’ve been trying to find the right words, and none of them feel big enough. So I’ll keep it simple: I’m sorry.',
    'I’m sorry for what I did, and more for how it made you feel. You deserved patience, and I gave you excuses.',
    'I’m not asking you to forget it. I’m asking for a chance to do better: to listen first, and to show up the way I should have.',
    'Whenever you’re ready to talk, I’ll be here. No rush at all.'
  ];
  $('seal').onclick=function(){
    to=$('to').value.trim()||'you';
    from=$('from').value.trim();
    $('toLine').textContent='For '+to;
    $('intro').classList.add('hidden');
    $('envScreen').classList.remove('hidden');
  };
  $('open').onclick=function(){
    $('env').classList.add('go');
    setTimeout(function(){$('envScreen').classList.add('leave')},2300);
    setTimeout(function(){
      $('envScreen').classList.add('hidden');
      $('letter').classList.remove('hidden');
      write();
    },3000);
  };
  function write(){
    var p=$('paper'),t=0.9,h='';
    lines.forEach(function(l,i){
      var s=typeof l==='function'?l():l;
      var d=t.toFixed(1)+'s';
      h+='<p class="ln" style="--d:'+d+'"></p>';
      t+=(i===0?1.2:2.2);
    });
    h+='<p class="ln sign" style="--d:'+t.toFixed(1)+'s"></p>';
    t+=2;
    h+='<button class="btn again" style="--d:'+t.toFixed(1)+'s" id="again">Read it again</button>';
    p.innerHTML=h;
    var ps=p.querySelectorAll('.ln');
    lines.forEach(function(l,i){ps[i].textContent=typeof l==='function'?l():l});
    ps[ps.length-1].textContent=from?'With all my heart, '+from:'With all my heart';
    $('again').onclick=function(){
      $('letter').classList.add('hidden');
      $('envScreen').classList.remove('hidden','leave');
      $('env').classList.remove('go');
    };
  }
})();
</script>
</body>
</html>
